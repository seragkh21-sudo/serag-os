<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Serag OS — المساعد الذكي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f7f8;--card:#fff;--line:#e7e7eb;--text:#18181b;--muted:#777783;--accent:#7058e8;--soft:#f0edff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.top h1{font-size:24px;margin:0}.muted{font-size:12px;color:var(--muted);line-height:1.6}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.chat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;min-height:360px}.messages{display:grid;gap:10px}.msg{max-width:82%;padding:11px 13px;border-radius:14px;font-size:14px;line-height:1.75;white-space:pre-wrap}.user{justify-self:start;background:var(--accent);color:#fff;border-bottom-left-radius:5px}.assistant{justify-self:end;background:#f2f2f4;border-bottom-right-radius:5px}.empty{text-align:center;padding:70px 18px;color:var(--muted);font-size:13px}.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:12px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.composer textarea{width:100%;resize:vertical;min-height:70px;max-height:180px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font:inherit;outline:none}.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.send{border:0;background:var(--accent);color:#fff;border-radius:12px;min-width:72px;font-weight:800}.send:disabled{opacity:.55;cursor:wait}.status{min-height:18px;margin-top:7px;font-size:11px;color:var(--muted)}@media(max-width:620px){.wrap{padding:12px}.msg{max-width:92%}.composer{grid-template-columns:1fr}.send{min-height:46px}.top h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1>المساعد الذكي ✦</h1><div class="muted">يقرأ بيانات Serag OS ويقدر ينفّذ أوامر جوه التطبيق.</div></div><a class="btn" href="/">رجوع</a></header>
  <main class="chat"><div id="messages" class="messages"><div class="empty" id="empty">اكتب له بشكل طبيعي.<br>مثال: «شربت كوبين مياه وضيفلي مهمة أخلص الفيديو بكرة الساعة 7».</div></div></main>
  <div class="chips">
    <button class="chip" type="button">شربت كوب مياه</button>
    <button class="chip" type="button">إيه اللي عليا النهارده؟</button>
    <button class="chip" type="button">ضيف كلمة إنجليزي جديدة</button>
    <button class="chip" type="button">رتبلي الكورسات اللي عندي</button>
    <button class="chip" type="button">قيّم تقدمي في الأكل والمياه</button>
  </div>
  <form id="form" class="composer"><textarea id="input" placeholder="اطلب أي حاجة..."></textarea><button id="send" class="send" type="submit">إرسال</button></form>
  <div id="status" class="status"></div>
</div>
<script>
const SUPABASE_URL='https://kdfbxcdxdhofqidczbot.supabase.co';
const SUPABASE_KEY='sb_publishable_51lY0ST_vE6v0nogH5RGkQ_z8lJ5EAM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const messages=document.getElementById('messages'),empty=document.getElementById('empty'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');
function add(role,text){if(empty)empty.style.display='none';const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'assistant');d.textContent=text;messages.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});}
async function session(){const {data:{session}}=await sb.auth.getSession();return session}
async function loadHistory(){const s=await session();if(!s){status.textContent='لازم تسجل دخول الأول من الصفحة الرئيسية.';return}const r=await fetch('/api/assistant',{headers:{Authorization:`Bearer ${s.access_token}`}});if(!r.ok)return;const data=await r.json();(data.messages||[]).forEach(m=>add(m.role,m.content));}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent.trim();input.focus()}));
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;const s=await session();if(!s){status.textContent='سجل دخول الأول من Serag OS.';return}add('user',text);input.value='';send.disabled=true;status.textContent='المساعد بيفكر وبيحدّث بياناتك لو الطلب محتاج...';try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${s.access_token}`},body:JSON.stringify({message:text,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone})});const data=await r.json();if(!r.ok)throw new Error(data.error||'حصل خطأ');add('assistant',data.answer||'تم.');status.textContent=(data.actions||[]).length?`تم تنفيذ ${(data.actions||[]).length} إجراء داخل Serag OS.`:'';}catch(err){add('assistant','حصلت مشكلة: '+err.message);status.textContent='';}finally{send.disabled=false;input.focus();}});
loadHistory();
</script>
</body>
</html>
