<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serag OS — الإدارة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script src="/admin.js" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#18181b;font-family:system-ui,Tahoma,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header,nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a,button{padding:10px 16px;border:1px solid #ddd;border-radius:10px;background:white;color:#42338c;text-decoration:none;font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #e7e7eb;border-radius:16px;padding:18px;margin:20px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:14px;border-bottom:1px solid #eee}p{color:#555}#status{min-height:24px}li{margin:12px 0;overflow-wrap:anywhere}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <header><h1>إدارة Serag OS</h1><button id="refresh" type="button">تحديث</button><a href="/">الصفحة الرئيسية</a></header>
  <p id="status" role="status" aria-live="polite">جاري التحقق من صلاحية الدخول…</p>
  <section id="dashboard" hidden>
    <div class="card"><h2>المستخدمون</h2><p id="summary"></p>
      <div class="scroll"><table><thead><tr><th>الإيميل / المعرّف</th><th>تاريخ التسجيل</th><th>تأكيد الإيميل</th><th>آخر دخول</th></tr></thead><tbody id="users"></tbody></table></div>
      <nav><button id="previous" type="button">السابق</button><span id="page"></span><button id="next" type="button">التالي</button></nav>
    </div>
    <div class="card"><h2>التسجيلات خلال آخر ٧ أيام — في الصفحة الحالية</h2><ul id="recent"></ul></div>
  </section>
</main></body></html>
