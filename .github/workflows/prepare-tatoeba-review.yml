name: Prepare Tatoeba review corpus

on:
  push:
    branches: [data/tatoeba-review-import]

permissions:
  contents: write

concurrency:
  group: tatoeba-review-import
  cancel-in-progress: false

jobs:
  prepare-review-data:
    if: ${{ !startsWith(github.event.head_commit.message, '[data-import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and prepare all available Arabic-English pairs for review
        run: |
          python scripts/import_tatoeba_ar_en.py --limit 20000 --output data/review/tatoeba-ar-en-review.jsonl
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("data/review/tatoeba-ar-en-review.jsonl")
          rows = [json.loads(line) for line in path.open(encoding="utf-8") if line.strip()]
          if len(rows) < 10000:
              raise SystemExit(f"Expected at least 10,000 sentence pairs, got {len(rows)}")
          if any(not row.get("english") or not row.get("arabic") or not row.get("attribution") for row in rows):
              raise SystemExit("A row is missing a sentence or source attribution; refusing to publish the review corpus.")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              "dataset": "Tatoeba English-Arabic via ManyThings",
              "source": "https://www.manythings.org/anki/",
              "download": "https://www.manythings.org/anki/ara-eng.zip",
              "source_updated": "2026-02-13",
              "license": "CC BY 2.0 FR",
              "attribution_policy": "Preserve the attribution field for each sentence pair; attribute ManyThings and Tatoeba.",
              "rows": len(rows),
              "sha256": digest,
              "review_status": "raw corpus; not approved for automatic publication as learning questions"
          }
          Path("data/review/tatoeba-ar-en-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Prepared {len(rows)} attributed sentence pairs. SHA256={digest}")
          PY
      - name: Commit review-only dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/tatoeba-ar-en-review.jsonl data/review/tatoeba-ar-en-manifest.json
          git commit -m "[data-import] add Tatoeba review corpus" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
