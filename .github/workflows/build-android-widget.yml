name: Build Serag OS Android Widget

on:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serag-android-widget-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-widget :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-widget/app/build/outputs/apk/debug/app-debug.apk Serag-OS-Android-v0.3.1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Serag-OS-Android-v0.3.1
          path: Serag-OS-Android-v0.3.1.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view serag-android-v0.3.1 >/dev/null 2>&1; then
            gh release upload serag-android-v0.3.1 Serag-OS-Android-v0.3.1.apk --clobber
          else
            gh release create serag-android-v0.3.1 Serag-OS-Android-v0.3.1.apk --title 'Serag OS Android v0.3.1' --notes 'Fixes widget authentication/sync. The water and English widgets now sync from the same signed-in WebView session, stay connected across login changes, and keep their direct home-screen actions working without opening the app.' --prerelease
          fi
