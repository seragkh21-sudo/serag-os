<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Serag OS Android Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>
const SUPABASE_URL='https://kdfbxcdxdhofqidczbot.supabase.co';
const SUPABASE_KEY='sb_publishable_51lY0ST_vE6v0nogH5RGkQ_z8lJ5EAM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let syncing=false;

function send(payload){
  try{window.SeragAndroid?.syncSnapshot(JSON.stringify(payload))}
  catch(e){console.error(e)}
}

function makeToken(){
  const bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
}

async function syncSnapshot(sessionOverride){
  if(syncing)return;
  syncing=true;
  try{
    let session=sessionOverride;
    if(typeof session==='undefined'){
      const result=await sb.auth.getSession();
      session=result.data?.session||null;
    }
    if(!session){
      send({loggedIn:false,updatedAt:Date.now()});
      return;
    }

    let deviceToken=localStorage.getItem('serag_widget_device_token');
    if(!deviceToken){
      deviceToken=makeToken();
      localStorage.setItem('serag_widget_device_token',deviceToken);
    }

    const {error:registerError}=await sb.rpc('register_widget_device',{p_token:deviceToken});
    if(registerError)throw registerError;

    const {data,error}=await sb.rpc('widget_snapshot',{p_token:deviceToken});
    if(error)throw error;

    send({
      loggedIn:true,
      deviceToken,
      waterToday:Number(data?.waterToday)||0,
      waterTarget:Number(data?.waterTarget)||2500,
      words:Array.isArray(data?.words)?data.words:[],
      updatedAt:Date.now()
    });
  }catch(error){
    send({loggedIn:true,error:String(error?.message||error),updatedAt:Date.now()});
  }finally{
    syncing=false;
  }
}

syncSnapshot();

sb.auth.onAuthStateChange((_event,session)=>{
  setTimeout(()=>syncSnapshot(session),120);
});

setInterval(()=>syncSnapshot(),15000);
</script>
</body>
</html>
